<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPG AI - La Aventura Comienza</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- PANTALLA DE CONFIGURACIÓN -->
  <div id="config-screen" class="screen active">
    <div class="config-box" id="config-form">
      <!-- Se genera dinámicamente por JS -->
    </div>
  </div>

  <!-- PANTALLA DE JUEGO -->
  <div id="game-screen" class="screen">
    <header class="game-header">
      <h1>La Aventura Comienza</h1>
    </header>

    <div class="main-container">
      <!-- Barra Lateral Izquierda -->
      <aside class="sidebar">
        <div class="character-card">
          <h2 id="char-name-sidebar">Eldrin</h2>
          <div id="character-info"></div>
        </div>
        
        <div class="api-box">
          <label for="api-key-input">🔑 API Key de Gemini</label>
          <input type="password" id="api-key-input" placeholder="AIzaSy...">
          <small>Se guarda localmente en tu navegador</small>
        </div>

        <div class="controls-box">
          <button id="speech-btn" onclick="toggleSpeech()">🔊 Voz Activada</button>
          <button class="danger-btn" onclick="resetAll()">Nueva Aventura</button>
        </div>
      </aside>

      <!-- Consola Central de Juego -->
      <main class="game-console">
        <div class="welcome-box">
          <h3>¡Bienvenido!</h3>
          <p>Escribe una acción o usa los botones de abajo para explorar el entorno.</p>
        </div>

        <div id="log" class="log-screen"></div>

        <!-- Botones de Acción Rápida -->
        <div class="quick-actions">
          <button onclick="quickAction('Mirar alrededor')">👀 Mirar alrededor</button>
          <button onclick="quickAction('Avanzar')">🏃 Avanzar</button>
          <button onclick="quickAction('Explorar')">🔍 Explorar</button>
          <button onclick="quickAction('Buscar objetos')">🎒 Buscar objetos</button>
        </div>

        <!-- Barra de Entrada de Texto -->
        <div class="input-area">
          <input type="text" id="action-input" placeholder='Ej: "entrar a la cueva", "hablar con el guardia", "atacar al goblin"...' onkeydown="if(event.key==='Enter') sendAction()">
          <button class="send-btn" onclick="sendAction()">Enviar Acción</button>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="script.js"></script>
  <script src="game.js"></script>
</body>
</html>
